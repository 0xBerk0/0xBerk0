name: Latest write-ups

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://0xberk0.github.io/feed.xml"
          max_post_count: 5
          template: "$newline- [$title]($url) — $date"
          date_format: "mmm yyyy"
          commit_message: "Update latest write-ups"
